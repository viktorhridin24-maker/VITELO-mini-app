<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>VITELO mini app</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#700707;--deep:#4a0404;--card:#8a1010;--line:#b22a2a;--text:#fff;--dim:#f0b8b8;--gold:#ffd24a}
*{box-sizing:border-box}
html,body{margin:0;min-height:var(--tg-viewport-height,100vh);background:var(--bg);color:var(--text); font-family: 'Comic Neue', cursive;}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.logo{display:block;margin:6px auto 14px;width:160px;height:auto}
.hero{background:var(--deep);border:2px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.hero .who{color:var(--dim);font-size:14px}
.hero .bal{font-size:46px;font-weight:bold;color:var(--gold);line-height:1.1;margin:6px 0 2px}
.hero .unit{font-size:15px;color:var(--dim)}
.ban{background:#000;color:#ff8a8a;padding:8px;border-radius:10px;margin-top:10px;font-size:14px}
nav{display:flex;gap:8px;margin:16px 0}
nav button{flex:1;font:inherit;font-size:15px;padding:10px 4px;color:var(--text);background:transparent;border:2px solid var(--line);border-radius:12px;cursor:pointer}
nav button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:bold}
nav button:focus-visible,.buy:focus-visible{outline:3px solid var(--gold)}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.t{font-size:15px}.s{font-size:12px;color:var(--dim)}
.plus{color:#9dffb0;font-weight:bold;white-space:nowrap}.minus{color:#ffb0b0;font-weight:bold;white-space:nowrap}
.emoji{font-size:28px;width:38px;text-align:center}
.cnt{background:var(--deep);border-radius:10px;padding:4px 10px;font-weight:bold}
.buy{font:inherit;padding:8px 12px;border:0;border-radius:10px;background:var(--gold);color:#3a0000;font-weight:bold;cursor:pointer}
.buy:disabled{opacity:.45}
.h{margin:18px 0 4px;font-size:16px}
.empty{color:var(--dim);text-align:center;padding:26px 0}
.send{display:block;width:100%;font:inherit;font-size:16px;font-weight:bold;padding:12px;border:0;border-radius:12px;background:var(--gold);color:#3a0000;cursor:pointer;margin-bottom:6px}
.send:disabled{opacity:.45}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--deep);border:2px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px 24px}
.sh-top{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:4px}
.x{font:inherit;background:transparent;border:0;color:var(--text);font-size:20px;cursor:pointer}
.sheet input{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:8px 0;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px}
.sheet input:focus{outline:3px solid var(--gold)}
.mlist{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px;max-height:200px;overflow:auto}
.ct{font:inherit;text-align:left;padding:10px 12px;color:var(--text);background:var(--card);border:2px solid transparent;border-radius:10px;cursor:pointer}
.ct.on{border-color:var(--gold);background:var(--bg)}
.big{width:100%;padding:12px;font-size:16px;margin-top:8px}
.s{overflow-wrap:anywhere}
.sheet textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;margin:0 0 8px;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;resize:none}
.sheet textarea:focus{outline:3px solid var(--gold)}
#err{background:#000;padding:14px;border-radius:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <svg class="logo" viewBox="0 0 180.52825 34.42788" xmlns="http://www.w3.org/2000/svg"><g transform="translate(-149.73588,-162.78606)"><g fill="#fffefe"><path d="M260.93176,163.03197h10.8843v23.05175h23.02443v10.8843h-33.9266v-10.8843h0.01786z"/><path d="M225.68418,173.89788h-0.01786v-10.8843h33.9266v10.8843h-23.02443v0.67363h15.59238v10.8843h-15.59238v0.64631h23.02443v10.8843h-33.9266v-10.8843h0.01786z"/><path d="M156.44149,196.9633l-6.7056,-33.9266h10.8843l2.88964,14.61996l2.88964,-14.61996h10.8843l-6.7056,33.9266z"/><path d="M178.09431,196.9633v-33.9266h10.8843v33.9266z"/><path d="M223.59994,173.89205h-11.52115v23.10019h-10.88431v-23.10019h-11.52115v-10.8843h33.9266z"/><path d="M330.26414,180c0,9.507 -7.70694,17.21394 -17.21394,17.21394c-9.507,0 -17.21394,-7.70694 -17.21394,-17.21394c0,-9.507 7.70694,-17.21394 17.21394,-17.21394c9.507,0 17.21394,7.70694 17.21394,17.21394zM313.05019,173.21279c-3.74847,0 -6.78721,3.03874 -6.78721,6.78721c0,3.74847 3.03874,6.78721 6.78721,6.78721c3.74847,0 6.78721,-3.03874 6.78721,-6.78721c0,-3.74847 -3.03874,-6.78721 -6.78721,-6.78721z"/></g></g></svg>

  <div id="app"><div class="empty">Загружаю кашолку…</div></div>
</div>

<script>
// ВПИШИ СЮДА адрес своего API (см. api.py), без слэша в конце
const API_URL = "https://economist-sandfish-canopy.ngrok-free.dev";

const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const ICONS = {ascorbinka:"💊", adrenaline:"💉", stop:"🛑", god_item:"💀"};
let state = null, tab = "wallet";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toFixed(2);

async function api(path, body) {
  const r = await fetch(API_URL + path, {
    method: body ? "POST" : "GET",
    headers: {"X-Init-Data": tg.initData, "Content-Type": "application/json", "ngrok-skip-browser-warning": "1"},
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Ошибка " + r.status);
  return j;
}

async function load() {
  try { state = await api("/api/me"); render(); }
  catch (e) { $("#app").innerHTML = `<div id="err">Не получилось загрузить: ${esc(e.message)}<br><br>Открой приложение из Telegram и проверь, что API запущен.</div>`; }
}

function render() {
  const u = state;
  const tabs = [["wallet","кашолка"],["shop","маг. пуков"],["history","история затрат"]];
  let body = "";
  if (tab === "wallet") {
    body = `<button class="send" id="sendbtn" ${u.is_banned?"disabled":""}>💸 передать в.</button><div class="h">инвентарь</div>` + u.shop.map(i => `
      <div class="row"><div class="emoji">${ICONS[i.key]||"🎁"}</div>
      <div class="grow"><div class="t">${esc(i.name)}</div>${i.key==="adrenaline"?`<div class="s">использований: ${u.adrenaline_uses}/3</div>`:""}</div>
      <div class="cnt">${u.inventory[i.key]||0}</div></div>`).join("");
  } else if (tab === "shop") {
    body = u.shop.map(i => `
      <div class="row"><div class="emoji">${ICONS[i.key]||"🎁"}</div>
      <div class="grow"><div class="t">${esc(i.name)} <span class="s">[${esc(i.rarity)}]</span></div><div class="s">${esc(i.desc)}</div></div>
      <button class="buy" data-k="${i.key}" ${u.is_banned||u.balance<i.price?"disabled":""}>${fmt(i.price)} в.</button></div>`).join("");
  } else {
    body = u.transactions.length ? u.transactions.map(t => `
      <div class="row"><div class="grow"><div class="t">${esc(t.note)}</div>${t.comment?`<div class="s">${esc(t.comment)}</div>`:""}<div class="s">${new Date(t.ts*1000).toLocaleString("ru-RU")}</div></div>
      <div class="${t.amount>=0?"plus":"minus"}">${t.amount>=0?"+":""}${fmt(t.amount)}</div></div>`).join("")
      : `<div class="empty">Операций пока нет. Крути рулетку в чате: «Вить, рулетка».</div>`;
  }
  $("#app").innerHTML = `
    <div class="hero"><div class="who">${esc(u.name)}</div>
      <div class="bal">${fmt(u.balance)}</div><div class="unit">виткоинов</div>
      ${u.is_banned?`<div class="ban">твоя кашолка заблокирована</div>`:""}</div>
    <nav>${tabs.map(([k,n])=>`<button class="${tab===k?"on":""}" data-t="${k}">${n}</button>`).join("")}</nav>
    <div>${body}</div>`;
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  document.querySelectorAll(".buy").forEach(b => b.onclick = () => buy(b.dataset.k));
  const sb = $("#sendbtn"); if (sb) sb.onclick = openTransfer;
}

async function buy(key) {
  try {
    await api("/api/buy", {item: key});
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    await load();
    tg.showAlert("куплено! предмет в инвентаре.");
  } catch (e) { tg.showAlert(e.message); }
}

// ---------- перевод виткоинов ----------
let sel = null, searchTimer = null, searchId = 0;

function closeTransfer() { const m = $("#modal"); if (m) m.remove(); sel = null; }

function openTransfer() {
  closeTransfer();
  const m = document.createElement("div");
  m.id = "modal";
  m.innerHTML = `<div class="sheet">
    <div class="sh-top"><b>передать виткоины</b><button class="x" id="mx">✕</button></div>
    <div class="s">баланс: ${fmt(state.balance)} в.</div>
    <input id="mq" placeholder="найти игрока по нику…" autocomplete="off">
    <div id="mlist" class="mlist"></div>
    <input id="mamt" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="сколько виткоинов">
    <textarea id="mnote" maxlength="200" rows="3"></textarea>
    <div class="s" id="mcnt" style="text-align:right">0/200</div>
    <div id="msel" class="s">выбери получателя</div>
    <button class="buy big" id="mok" disabled>подтвердить</button>
  </div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) closeTransfer(); };
  $("#mx").onclick = closeTransfer;
  $("#mq").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadContacts, 300); };
  $("#mamt").oninput = checkReady;
  $("#mnote").oninput = () => { $("#mcnt").textContent = $("#mnote").value.length + "/200"; };
  const PH = ["опиши весь свой заказ с ресторана", "расскажи сказку на ночь", "опиши свой вклад человеку", "за что донатишь?", "напиши пожелание получателю", "что на повестке?"];
  $("#mnote").placeholder = PH[Math.floor(Math.random() * PH.length)];
  $("#mok").onclick = confirmTransfer;
  loadContacts();
}

async function loadContacts() {
  const myId = ++searchId;
  const q = $("#mq") ? $("#mq").value.trim() : "";
  const box = $("#mlist"); if (!box) return;
  try {
    const r = await api("/api/contacts?q=" + encodeURIComponent(q));
    if (myId !== searchId || !$("#mlist")) return;
    if (!r.contacts.length) {
      box.innerHTML = `<div class="s">${r.searching ? "никого не нашёл. человек должен хоть раз написать боту." : "пока нет недавних. начни вводить ник, чтобы найти игрока."}</div>`;
    } else {
      box.innerHTML = (r.searching ? "" : `<div class="s">Недавние:</div>`) + r.contacts.map(c =>
        `<button class="ct${sel && sel.id === c.id ? " on" : ""}" data-id="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}</button>`).join("");
      box.querySelectorAll(".ct").forEach(b => b.onclick = () => {
        sel = {id: Number(b.dataset.id), name: b.dataset.name};
        box.querySelectorAll(".ct").forEach(x => x.classList.toggle("on", x === b));
        $("#msel").textContent = "получатель: " + sel.name;
        checkReady();
      });
    }
  } catch (e) { box.innerHTML = `<div class="s">${esc(e.message)}</div>`; }
}

function checkReady() {
  const a = parseFloat(($("#mamt").value || "").replace(",", "."));
  $("#mok").disabled = !(sel && a >= 0.01 && a <= state.balance);
}

function confirmTransfer() {
  const a = Math.round(parseFloat($("#mamt").value.replace(",", ".")) * 100) / 100;
  const text = `Передать ${fmt(a)} в. игроку ${sel.name}?`;
  const note = $("#mnote").value.trim();
  const go = ok => { if (ok) doTransfer(sel.id, sel.name, a, note); };
  if (tg.showConfirm) tg.showConfirm(text, go); else go(window.confirm(text));
}

async function doTransfer(to, name, amount, comment) {
  const btn = $("#mok"); if (btn) btn.disabled = true;
  try {
    await api("/api/transfer", {to, amount, comment});
    closeTransfer();
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    await load();
    tg.showAlert(`готово! ${fmt(amount)} в. переданы игроку ${name}.`);
  } catch (e) {
    if (btn) btn.disabled = false;
    tg.showAlert(e.message);
  }
}
load();
</script>
</body>
</html>
